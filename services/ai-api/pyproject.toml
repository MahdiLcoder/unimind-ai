[project]
name = "unimind-ai-api"
version = "0.1.0"
description = "FastAPI foundation for UniMind AI"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.120,<1",
    "huggingface-hub>=0.35,<1",
    "httpx>=0.28,<1",
    "pgvector>=0.4,<1",
    "pypdf>=6,<7",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<7",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "uvicorn[standard]>=0.35,<1",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "langchain-core>=1.2,<2",
    "langchain-ollama>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
inference = [
    "sentence-transformers>=5.1,<6",
    "torch>=2.6,<3",
    "transformers>=4.57,<5",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
