groups:
  - name: unimind-availability
    rules:
      - alert: UniMindApiDown
        expr: up{job="ai-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: UniMind API metrics endpoint is unavailable

      - alert: UniMindDatabaseExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL metrics exporter is unavailable

      - alert: UniMindDatabaseDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL is not accepting exporter connections

      - alert: UniMindRedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Redis metrics exporter is unavailable

      - alert: UniMindRedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis is not accepting exporter connections

      - alert: UniMindHighApiErrorRate
        expr: |
          sum(rate(unimind_http_requests_total{status="5xx"}[5m]))
          /
          clamp_min(sum(rate(unimind_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API 5xx error rate exceeded 5%

      - alert: UniMindSlowApiRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(unimind_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeded 2 seconds

      - alert: UniMindAgentFailures
        expr: sum(rate(unimind_agent_executions_total{outcome="failure"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent failures exceeded 0.1 per second
