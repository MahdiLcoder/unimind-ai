apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unimind
spec:
  tls:
    - hosts:
        - unimind.dev.local
        - api.unimind.dev.local
      secretName: unimind-development-tls
  rules:
    - host: unimind.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: api.unimind.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-api
                port:
                  number: 8000
