apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
  labels:
    app.kubernetes.io/name: ai-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-schema
          image: ghcr.io/unimind-ai/unimind-ai-api:latest
          command:
            - sh
            - -c
            - until alembic current --check-heads; do sleep 5; done
          envFrom:
            - configMapRef:
                name: unimind-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: api
          image: ghcr.io/unimind-ai/unimind-ai-api:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: unimind-config
          env:
            - name: CLERK_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: CLERK_JWKS_URL
            - name: CLERK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: CLERK_ISSUER
            - name: ADMIN_CLERK_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: ADMIN_CLERK_USER_IDS
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: REDIS_URL
            - name: OLLAMA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_MODEL
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: OLLAMA_MODEL
            - name: METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: unimind-secrets
                  key: METRICS_BEARER_TOKEN
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: model-cache
              mountPath: /home/app/.cache/huggingface
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-api
  labels:
    app.kubernetes.io/name: ai-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
