apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unimind
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - unimind.example.com
        - api.unimind.example.com
      secretName: unimind-tls
  rules:
    - host: unimind.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: api.unimind.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-api
                port:
                  number: 8000
