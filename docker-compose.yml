services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: unimind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unimind
      POSTGRES_USER: unimind
      POSTGRES_PASSWORD: unimind_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimind -d unimind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: unimind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: